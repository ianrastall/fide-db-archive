name: Prepare monthly FIDE ratings
on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Optional YYYY-MM override (normally calculated in UTC)'
        required: false
        type: string
  schedule:
    - cron: '17 12,18,21,23 28-31 * *'
    - cron: '17 0,3 1-7 * *'
permissions:
  contents: write
concurrency:
  group: fide-monthly
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Most hosted runner addresses time out connecting to FIDE for the life of
    # the runner, so try several in turn. Published months are skipped.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test monthly conversion
        run: python -m unittest test_refresh_monthly
      - name: Check FIDE access
        id: access
        shell: bash
        run: |
          if curl -sS -I --connect-timeout 20 --max-time 30 -o /dev/null https://ratings.fide.com/download/players_list_xml.zip; then
            echo 'reachable=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::This runner cannot reach ratings.fide.com'
          fi
      - name: Prepare and publish verified data
        if: steps.access.outputs.reachable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PERIOD: ${{ inputs.period }}
        shell: bash
        run: |
          args=()
          if [ -n "$PERIOD" ]; then args+=(--period "$PERIOD"); fi
          python refresh_monthly.py --publish "${args[@]}"
  report:
    needs: prepare
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check a due period is published
        env:
          GH_TOKEN: ${{ github.token }}
          PERIOD: ${{ inputs.period }}
        shell: bash
        run: |
          args=()
          if [ -n "$PERIOD" ]; then args+=(--period "$PERIOD"); fi
          python refresh_monthly.py --require-published "${args[@]}"
